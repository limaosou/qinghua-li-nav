name: Bug 反馈
description: 遇到问题或功能异常，请提交此模板
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 清楚描述你遇到的现象
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何复现这个问题（越具体越好）
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 / Node 版本 / 部署方式（宝塔 / PM2 / Docker）
      placeholder: "macOS 15 / Node 22 / Docker"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关报错或截图（可拖拽上传）
    validations:
      required: false
